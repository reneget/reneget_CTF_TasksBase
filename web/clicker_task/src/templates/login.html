<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clicker Login</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <p class="overline">Clicker Access</p>
      <h1>Log In</h1>
      <p class="auth-muted">Legacy auth is still enabled while the new panel is in progress.</p>

      {% if notice %}
      <p class="notice notice-ok">{{ notice }}</p>
      {% endif %}
      {% if error %}
      <p class="notice notice-error">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login" class="auth-form">
        <input name="username" placeholder="Username" autocomplete="off" required />
        <input name="password" type="password" placeholder="Password" autocomplete="off" required />
        <button type="submit">Log in</button>
      </form>

      <div class="hint-box">
        <strong>Ops note:</strong> staff usernames are still mirrored from old sqlite auth.
      </div>

      <div class="auth-links">
        <a href="/register" class="chat-link">Create account</a>
        <a href="/" class="chat-link">Back to clicker</a>
      </div>
    </main>
  </body>
</html>
